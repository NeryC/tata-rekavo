name: Update data

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore API cache
        uses: actions/cache/restore@v4
        with:
          path: data/api_cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Fetch current FIRMS data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python firms_pipeline.py fetch-current --out data/app

      # a Bolivia failure must not hold back the Paraguay update; the contract check below still runs on the Bolivia files
      - name: Fetch current FIRMS data (Bolivia)
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python firms_pipeline.py fetch-current --country BOL --out data/app/BOL

      - name: Fetch current FIRMS data (Uruguay)
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python firms_pipeline.py fetch-current --country URY --out data/app/URY

      - name: Fetch current FIRMS data (Peru)
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python firms_pipeline.py fetch-current --country PER --out data/app/PER

      - name: Fetch current FIRMS data (Ecuador)
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python firms_pipeline.py fetch-current --country ECU --out data/app/ECU

      - name: Save API cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/api_cache
          key: api-cache-${{ github.run_id }}

      - name: Validate data contract
        run: node test_contract.mjs data/app

      - name: Validate data contract (Bolivia)
        run: node test_contract.mjs data/app/BOL

      - name: Validate data contract (Uruguay)
        run: node test_contract.mjs data/app/URY

      - name: Validate data contract (Peru)
        run: node test_contract.mjs data/app/PER

      - name: Validate data contract (Ecuador)
        run: node test_contract.mjs data/app/ECU

      # with the live data store on (repository variable DATA_STORE = r2), the daily files go to Cloudflare R2
      # instead of git, so the repository history stops growing every day; see scripts/publish-live.sh
      - name: Publish current data to the live store
        if: vars.DATA_STORE == 'r2'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/publish-live.sh data/app

      - name: Keep the daily files out of git (live store on)
        if: vars.DATA_STORE == 'r2'
        run: git checkout -- $(git ls-files 'data/app/current.json' 'data/app/*/current.json' 'data/app/current_hotspots.csv' 'data/app/*/current_hotspots.csv')

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain data/app)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/app
          git commit -m "data: daily FIRMS update $(date -u +%F)"
          git pull --rebase origin main
          git push
