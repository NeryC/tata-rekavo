name: Update data

on:
  schedule:
    # twice a day, after the VIIRS overpasses (~01:30 and ~13:30 local) and FIRMS' ~3 h latency:
    # 05:17 and 17:17 in Asunción (UTC-3)
    - cron: "17 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore API cache
        uses: actions/cache/restore@v4
        with:
          path: data/api_cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      # every country of the index, one after the other: a country that fails keeps its previous data and the others
      # still go out; adding a country needs no change here (scripts/update-countries.sh)
      - name: Fetch and check every country
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: bash scripts/update-countries.sh failed-countries.txt data/app

      - name: Save API cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/api_cache
          key: api-cache-${{ github.run_id }}

      # with the live data store on (repository variable DATA_STORE = r2), the daily files go to Cloudflare R2
      # instead of git, so the repository history stops growing every day; see scripts/publish-live.sh
      - name: Publish current data to the live store
        if: vars.DATA_STORE == 'r2'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/publish-live.sh data/app failed-countries.txt

      - name: Keep the daily files out of git (live store on)
        if: vars.DATA_STORE == 'r2'
        run: git checkout -- $(git ls-files 'data/app/current.json' 'data/app/*/current.json' 'data/app/current_hotspots.csv' 'data/app/*/current_hotspots.csv')

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain data/app)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/app
          git commit -m "data: daily FIRMS update $(date -u +%F)"
          git pull --rebase origin main
          git push

      # the data went out; a country that failed today turns the run red so its owner gets the e-mail
      - name: Report countries that failed
        if: always()
        run: |
          if [ -s failed-countries.txt ]; then
            while read -r line; do echo "::error::${line}: kept the previous data"; done < failed-countries.txt
            exit 1
          fi
